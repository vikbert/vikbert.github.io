version: '3'

tasks:
  default:
    cmds:
      - taskr --list
  deploy:
    desc: Deploy to GitHub Pages
    aliases:
      - d
    cmds:
      - rm -rf docs/*
      - npm run build
      - git add .
      - git commit -m "Deploy to GitHub Pages"
      - git push origin master
      - open https://vikbert.github.io/
      - taskr --list
  dev:
    desc: Start development server
    cmds:
      - npm run dev